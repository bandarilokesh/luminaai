<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 800; fill: #F8FAFC; letter-spacing: -0.5px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #94A3B8; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #E2E8F0; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; dominant-baseline: middle; }
      .node-subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; text-anchor: middle; dominant-baseline: middle; }
      .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 600; fill: #94A3B8; text-anchor: middle; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; dominant-baseline: middle; }
      .stream-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
    </style>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="860" rx="20" fill="url(#bgGrad)" />
  <rect width="1196" height="856" x="2" y="2" rx="18" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(50, 42)">
    <circle cx="20" cy="20" r="18" fill="#D97706" />
    <text x="20" y="21" font-size="20" text-anchor="middle" dominant-baseline="middle">📊</text>
    <text x="50" y="16" class="title">Dual-Stream TeX-RAG Processing Pipeline</text>
    <text x="50" y="38" class="subtitle">Multimodal Extraction of Structured Tables &amp; LaTeX Equations with Cell-Level Grounding</text>
  </g>

  <!-- ==================== LEFT COLUMN: INPUT & SPLITTER ==================== -->
  <g transform="translate(50, 100)">
    <rect width="180" height="710" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    <text x="90" y="32" class="stage-title" text-anchor="middle">1. INPUT PDF</text>

    <!-- PDF Icon Box -->
    <g transform="translate(20, 60)" filter="url(#shadow)">
      <rect width="140" height="90" rx="10" fill="url(#indigoGrad)" />
      <text x="70" y="38" font-size="28" text-anchor="middle">📑</text>
      <text x="70" y="68" class="node-text">Academic PDF</text>
    </g>

    <!-- Elements Inside PDF -->
    <g transform="translate(20, 175)">
      <rect width="140" height="42" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1" />
      <text x="70" y="21" class="node-text" fill="#93C5FD">📝 Narrative Text</text>
    </g>
    <g transform="translate(20, 230)">
      <rect width="140" height="42" rx="6" fill="#1E293B" stroke="#8B5CF6" stroke-width="1" />
      <text x="70" y="21" class="node-text" fill="#C4B5FD">∑ LaTeX Math</text>
    </g>
    <g transform="translate(20, 285)">
      <rect width="140" height="42" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1" />
      <text x="70" y="21" class="node-text" fill="#FDE68A">📊 2D Data Tables</text>
    </g>

    <line x1="90" y1="340" x2="90" y2="395" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-slate)" />

    <!-- Dual Router Box -->
    <g transform="translate(15, 400)" filter="url(#shadow)">
      <rect width="150" height="60" rx="10" fill="#1E293B" stroke="#6366F1" stroke-width="2" />
      <text x="75" y="22" class="node-text">Layout Router</text>
      <text x="75" y="42" class="node-subtext">Stream Separation</text>
    </g>
  </g>

  <!-- Routing Lines to Dual Streams -->
  <path d="M 215 530 L 260 530 L 260 250 L 300 250" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#arrow-blue)" />
  <path d="M 215 530 L 260 530 L 260 610 L 300 610" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-amber)" />

  <!-- ==================== MIDDLE: DUAL STREAMS ==================== -->

  <!-- STREAM A: NARRATIVE & EQUATIONS -->
  <g transform="translate(300, 100)">
    <rect width="520" height="340" rx="14" fill="#0F172A" stroke="#1E3A8A" stroke-width="1.5" />
    <rect width="520" height="36" rx="14" fill="#172554" />
    <rect width="520" height="18" y="18" fill="#172554" />
    <text x="20" y="24" class="stage-title" fill="#60A5FA">STREAM A: Text &amp; Mathematical Discourse (PyMuPDF)</text>

    <!-- Node A1: PyMuPDF Parser -->
    <g transform="translate(30, 60)" filter="url(#shadow)">
      <rect width="210" height="52" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
      <text x="105" y="20" class="node-text">PyMuPDF Text Cleaner</text>
      <text x="105" y="36" class="node-subtext">Hyphen fix &amp; Header removal</text>
    </g>

    <line x1="240" y1="86" x2="275" y2="86" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)" />

    <!-- Node A2: LaTeX Normalizer -->
    <g transform="translate(280, 60)" filter="url(#shadow)">
      <rect width="210" height="52" rx="8" fill="url(#purpleGrad)" />
      <text x="105" y="20" class="node-text">LaTeX Math Normalizer</text>
      <text x="105" y="36" class="node-subtext">Wraps in $$...$$ &amp; $...$</text>
    </g>

    <path d="M 385 112 L 385 145 L 135 145 L 135 170" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)" />

    <!-- Node A3: Recursive Chunker -->
    <g transform="translate(30, 172)" filter="url(#shadow)">
      <rect width="210" height="52" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
      <text x="105" y="20" class="node-text">Recursive Chunker</text>
      <text x="105" y="36" class="node-subtext">400 tokens / 60 overlap</text>
    </g>

    <line x1="240" y1="198" x2="275" y2="198" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)" />

    <!-- Node A4: Jina Embeddings -->
    <g transform="translate(280, 172)" filter="url(#shadow)">
      <rect width="210" height="52" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1.5" />
      <text x="105" y="20" class="node-text">Jina v3 Embeddings</text>
      <text x="105" y="36" class="node-subtext">1024-dim dense vectors</text>
    </g>

    <!-- Node A5: Qdrant Text Store -->
    <g transform="translate(140, 255)" filter="url(#shadow)">
      <rect width="240" height="56" rx="10" fill="url(#emeraldGrad)" />
      <text x="120" y="21" class="node-text">🗄️ lumina_papers</text>
      <text x="120" y="39" class="node-subtext">Qdrant Narrative Collection</text>
    </g>
    <path d="M 385 224 L 385 240 L 260 240 L 260 252" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-emerald)" />
  </g>

  <!-- STREAM B: STRUCTURED TABLES (NOVELTY 4) -->
  <g transform="translate(300, 470)">
    <rect width="520" height="340" rx="14" fill="#0F172A" stroke="#78350F" stroke-width="1.5" />
    <rect width="520" height="36" rx="14" fill="#451A03" />
    <rect width="520" height="18" y="18" fill="#451A03" />
    <text x="20" y="24" class="stage-title" fill="#FBBF24">STREAM B: Structured Tables Engine (pdfplumber)</text>
    
    <!-- Badge Novelty 4 -->
    <g transform="translate(425, 8)">
      <rect width="75" height="20" rx="10" fill="#B45309" stroke="#FDE68A" stroke-width="1" />
      <text x="37" y="11" class="badge-text">NOVELTY 4</text>
    </g>

    <!-- Node B1: pdfplumber Layout -->
    <g transform="translate(30, 60)" filter="url(#shadow)">
      <rect width="210" height="52" rx="8" fill="url(#amberGrad)" />
      <text x="105" y="20" class="node-text">pdfplumber Extractor</text>
      <text x="105" y="36" class="node-subtext">Bounding box &amp; lines detection</text>
    </g>

    <line x1="240" y1="86" x2="275" y2="86" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-amber)" />

    <!-- Node B2: Caption Attributor -->
    <g transform="translate(280, 60)" filter="url(#shadow)">
      <rect width="210" height="52" rx="8" fill="url(#amberGrad)" />
      <text x="105" y="20" class="node-text">Caption Attributor</text>
      <text x="105" y="36" class="node-subtext">Vertical vicinity scan ("Table 1...")</text>
    </g>

    <path d="M 385 112 L 385 145 L 135 145 L 135 170" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-amber)" />

    <!-- Node B3: Dual Representation -->
    <g transform="translate(30, 172)" filter="url(#shadow)">
      <rect width="210" height="52" rx="8" fill="#1E293B" stroke="#D97706" stroke-width="1.5" />
      <text x="105" y="20" class="node-text">Dual Matrix Serializer</text>
      <text x="105" y="36" class="node-subtext">Markdown + JSON 2D Grid</text>
    </g>

    <line x1="240" y1="198" x2="275" y2="198" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-amber)" />

    <!-- Node B4: Table Caption Embedding -->
    <g transform="translate(280, 172)" filter="url(#shadow)">
      <rect width="210" height="52" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1.5" />
      <text x="105" y="20" class="node-text">Schema Embedding</text>
      <text x="105" y="36" class="node-subtext">Jina v3: Caption + Headers</text>
    </g>

    <!-- Node B5: Dual Stores -->
    <g transform="translate(30, 255)" filter="url(#shadow)">
      <rect width="210" height="56" rx="10" fill="url(#emeraldGrad)" />
      <text x="105" y="21" class="node-text">🗄️ lumina_tables</text>
      <text x="105" y="39" class="node-subtext">Qdrant Table Collection</text>
    </g>
    <g transform="translate(280, 255)" filter="url(#shadow)">
      <rect width="210" height="56" rx="10" fill="#1E293B" stroke="#059669" stroke-width="1.5" />
      <text x="105" y="21" class="node-text">🗃️ SQLite: paper_tables</text>
      <text x="105" y="39" class="node-subtext">Raw Markdown &amp; JSON Cells</text>
    </g>
    <path d="M 385 224 L 385 240 L 135 240 L 135 252" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-emerald)" />
    <path d="M 385 224 L 385 252" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-emerald)" />
  </g>

  <!-- ==================== RIGHT COLUMN: HYBRID RETRIEVAL & GROUNDING ==================== -->
  <g transform="translate(850, 100)">
    <rect width="300" height="710" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    <text x="150" y="32" class="stage-title" text-anchor="middle">3. HYBRID RETRIEVAL &amp; QA</text>

    <!-- Query Node -->
    <g transform="translate(25, 60)" filter="url(#shadow)">
      <rect width="250" height="54" rx="10" fill="url(#indigoGrad)" />
      <text x="125" y="20" class="node-text">💬 User Empirical Query</text>
      <text x="125" y="38" class="node-subtext">"What was the F1 score in Table 2?"</text>
    </g>

    <line x1="150" y1="114" x2="150" y2="140" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-slate)" />

    <!-- Query Intent Router -->
    <g transform="translate(25, 142)">
      <rect width="250" height="50" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1.5" />
      <text x="125" y="19" class="node-text">Query Classifier</text>
      <text x="125" y="35" class="node-subtext">Detects empirical / numeric intent</text>
    </g>

    <line x1="150" y1="192" x2="150" y2="220" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-slate)" />

    <!-- Hybrid Retrieval Box -->
    <g transform="translate(25, 222)" filter="url(#shadow)">
      <rect width="250" height="66" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
      <text x="125" y="18" class="node-text">Hybrid Retrieval</text>
      <text x="125" y="34" class="node-subtext">Top-5 Narrative Chunks</text>
      <text x="125" y="50" class="node-subtext">+ Top-2 Relevant Tables</text>
    </g>

    <!-- Arrows from Vector DBs into Hybrid Retrieval -->
    <path d="M 540 380 L 845 380 L 845 260 L 872 260" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="4,4" />
    <path d="M 540 750 L 845 750 L 845 275 L 872 275" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4" />

    <line x1="150" y1="288" x2="150" y2="315" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-slate)" />

    <!-- Context Assembly -->
    <g transform="translate(25, 317)">
      <rect width="250" height="64" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
      <text x="125" y="18" class="node-text">Context Injection</text>
      <text x="125" y="34" class="node-subtext">Markdown Table Grid Injected</text>
      <text x="125" y="50" class="node-subtext">+ Strict System Prompts</text>
    </g>

    <line x1="150" y1="381" x2="150" y2="410" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-slate)" />

    <!-- LLM Reasoning -->
    <g transform="translate(25, 412)" filter="url(#shadow)">
      <rect width="250" height="54" rx="10" fill="url(#purpleGrad)" />
      <text x="125" y="20" class="node-text">🧠 Groq / Gemini LLM</text>
      <text x="125" y="38" class="node-subtext">Zero-hallucination constraint</text>
    </g>

    <line x1="150" y1="466" x2="150" y2="495" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-slate)" />

    <!-- Deliverables Box -->
    <g transform="translate(20, 500)" filter="url(#shadow)">
      <rect width="260" height="180" rx="10" fill="#1E293B" stroke="#059669" stroke-width="2" />
      <text x="130" y="24" class="stage-title" fill="#34D399" text-anchor="middle">GROUNDED OUTPUTS</text>
      
      <rect x="15" y="42" width="230" height="36" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="130" y="60" class="node-subtext" fill="#FFFFFF">🎯 Cell-Level Tabular Citations</text>
      <text x="130" y="72" font-size="9" fill="#94A3B8" text-anchor="middle">Table 2, Row 'Ours', Col 'F1'</text>

      <rect x="15" y="86" width="230" height="36" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="130" y="104" class="node-subtext" fill="#FFFFFF">∑ KaTeX Mathematical Formulas</text>
      <text x="130" y="116" font-size="9" fill="#94A3B8" text-anchor="middle">Rendered live in dark-mode UI</text>

      <rect x="15" y="130" width="230" height="36" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="130" y="148" class="node-subtext" fill="#FFFFFF">📑 Interactive Table Modal Viewer</text>
      <text x="130" y="160" font-size="9" fill="#94A3B8" text-anchor="middle">Highlighted cell on click</text>
    </g>
  </g>
</svg>
