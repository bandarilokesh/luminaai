<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina AI</title>
    <meta name="description" content="Lumina AI - a RAG research assistant: ask grounded questions about your papers, summarize, and study." />
    <link rel="icon" href="/static/img/lumina.ico" />
    <link rel="stylesheet" href="/static/css/styles.css?v=6" />
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js" defer></script>
</head>

<body>

    <div class="app-shell">
        <!-- ========== SIDEBAR ========== -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div
                    style="width:40px;height:40px;border-radius:8px;background:var(--primary-container);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <span class="material-symbols-outlined"
                        style="color:var(--on-primary-container);font-size:24px;">neurology</span>
                </div>
                <div class="sidebar-brand-text">
                    <div class="brand-name">Lumina AI</div>
                    <div class="brand-sub">AI Research Assistant</div>
                </div>
            </div>

            <nav class="nav-items">
                <a class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
                    <span class="material-symbols-outlined">dashboard</span>
                    <span>Dashboard</span>
                </a>
                <a class="nav-item" data-page="library" onclick="navigate('library')">
                    <span class="material-symbols-outlined">library_books</span>
                    <span>Library</span>
                </a>
                <a class="nav-item" data-page="upload" onclick="navigate('upload')">
                    <span class="material-symbols-outlined">upload_file</span>
                    <span>Upload</span>
                </a>
                <a class="nav-item" data-page="qa" onclick="navigate('qa')">
                    <span class="material-symbols-outlined">chat_bubble</span>
                    <span>QA</span>
                </a>
                <a class="nav-item" data-page="summary" onclick="navigate('summary')">
                    <span class="material-symbols-outlined">article</span>
                    <span>Summary</span>
                </a>
                <a class="nav-item" data-page="study-tools" onclick="navigate('study-tools')">
                    <span class="material-symbols-outlined">school</span>
                    <span>Study Tools</span>
                </a>
                <a class="nav-item" data-page="research-gaps" onclick="navigate('research-gaps')">
                    <span class="material-symbols-outlined">troubleshoot</span>
                    <span>Research Gaps</span>
                </a>

                <a class="nav-item" data-page="comparison" onclick="navigate('comparison')">
                    <span class="material-symbols-outlined">compare_arrows</span>
                    <span>Compare</span>
                </a>
            </nav>

            <div class="nav-footer">
                <a class="nav-item" data-page="settings" onclick="navigate('settings')">
                    <span class="material-symbols-outlined">settings</span>
                    <span>Settings</span>
                </a>
                <a class="nav-item" href="/docs" target="_blank" rel="noopener" style="cursor:pointer;">
                    <span class="material-symbols-outlined">help</span>
                    <span>API Docs</span>
                </a>
                <a class="nav-item" onclick="toggleSidebar()" style="cursor:pointer; margin-top:16px;">
                    <span class="material-symbols-outlined">keyboard_double_arrow_left</span>
                    <span>Hide Menu</span>
                </a>
            </div>
        </aside>

        <!-- ========== MAIN CONTENT ========== -->
        <div class="main-content">
            <!-- Top Navigation -->
            <header class="topnav">
                <div class="topnav-left">
                    <!-- Mobile menu button -->
                    <button class="icon-btn" id="mobile-menu-btn" onclick="toggleSidebar()"
                        style="background:none;border:none;color:var(--on-surface-variant);cursor:pointer;">
                        <span class="material-symbols-outlined">menu</span>
                    </button>
                    <h1 class="topnav-title" id="topnav-title">Dashboard</h1>
                </div>

                <div class="topnav-right">
                    <!-- Removed right icons and search as requested -->
                </div>
            </header>

            <!-- Dynamic Page Content -->
            <main class="page-container" id="page-content">
                <!-- Content injected by app.js -->
                <div style="display:flex;justify-content:center;padding:80px 0;">
                    <div class="spinner"></div>
                </div>
            </main>

        </div>
    </div>

    <!-- ========== MOBILE BOTTOM NAV ========== -->
    <nav class="mobile-nav" id="mobile-nav">
        <button class="mobile-nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
            <span class="material-symbols-outlined">dashboard</span>
            <span>Home</span>
        </button>
        <button class="mobile-nav-item" data-page="library" onclick="navigate('library')">
            <span class="material-symbols-outlined">library_books</span>
            <span>Library</span>
        </button>
        <button class="mobile-nav-item" data-page="qa" onclick="navigate('qa')">
            <span class="material-symbols-outlined">chat_bubble</span>
            <span>QA</span>
        </button>
        <button class="mobile-nav-item" data-page="settings" onclick="navigate('settings')">
            <span class="material-symbols-outlined">settings</span>
            <span>Settings</span>
        </button>
    </nav>

    <!-- Mobile Sidebar Toggle -->
    <script>
        function toggleSidebar() {
            document.body.classList.toggle('sidebar-collapsed');
        }

        // Show/hide mobile menu button based on viewport
        function handleResize() {
            if (window.innerWidth < 1024) {
                document.body.classList.add('mobile-view');
            } else {
                document.body.classList.remove('mobile-view');
            }
        }
        window.addEventListener('resize', handleResize);
        handleResize();
    </script>

    <!-- Main Application Script -->
    <script src="/static/js/app.js" defer></script>

</body>

</html>
