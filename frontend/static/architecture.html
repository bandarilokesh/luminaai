<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina AI — System Architecture Diagram</title>
  <link rel="icon" type="image/x-icon" href="/static/img/lumina.ico">
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    body {
      background: #0B0F19;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .header-bar {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .title-group h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .title-group p {
      margin: 4px 0 0 0;
      font-size: 14px;
      color: #94A3B8;
    }
    .btn-group {
      display: flex;
      gap: 12px;
    }
    .btn-dl {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-png {
      background: #4F46E5;
      color: #FFFFFF;
      border: 1px solid #6366F1;
    }
    .btn-png:hover {
      background: #4338CA;
      transform: translateY(-1px);
    }
    .btn-svg {
      background: #1E293B;
      color: #F8FAFC;
      border: 1px solid #334155;
    }
    .btn-svg:hover {
      background: #334155;
      transform: translateY(-1px);
    }
    .diagram-frame {
      width: 100%;
      max-width: 1000px;
      background: #0F172A;
      border: 1px solid #1E293B;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .diagram-frame img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="title-group">
      <h1>💡 Lumina AI — System Architecture</h1>
      <p>Dual-Stream TeX-RAG & 5D Reproducibility Evaluation Engine</p>
    </div>
    <div class="btn-group">
      <a href="/static/img/lumina_architecture.png" download="lumina_architecture.png" class="btn-dl btn-png">
        ⬇️ Download High-Res PNG (2000px)
      </a>
      <a href="/static/img/lumina_architecture.svg" download="lumina_architecture.svg" class="btn-dl btn-svg">
        ⬇️ Download Vector SVG
      </a>
    </div>
  </div>

  <div class="diagram-frame">
    <img src="/static/img/lumina_architecture.png" alt="Lumina AI System Architecture Diagram" />
  </div>

</body>
</html>
