services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: lumina-qdrant
    ports:
      - "6333:6333"   # REST API + dashboard at http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  app:
    build: .
    container_name: lumina-app
    profiles: ["app"]   # start with: docker compose --profile app up -d
    env_file: .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
